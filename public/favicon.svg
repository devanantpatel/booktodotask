<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Dark Leather/Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24140b" />
      <stop offset="100%" stop-color="#120803" />
    </linearGradient>
    
    <!-- Warm Amber Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Check Accent -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle with Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="2.5" />

  <!-- Stylized Open Book / Spine Geometry -->
  <path d="M14 44 V20 C14 17 22 17 32 21 C42 17 50 17 50 20 V44 C40 40 34 40 32 42 C30 40 24 40 14 44 Z" fill="#fef3c7" stroke="#451a03" stroke-width="2" />

  <!-- Center Spine Line -->
  <line x1="32" y1="21" x2="32" y2="42" stroke="#b45309" stroke-width="1.8" stroke-linecap="round" />

  <!-- Left Page Bookmark Ribbon (Amber) -->
  <path d="M22 18 V28 L25.5 25 L29 28 V18 Z" fill="url(#goldGrad)" />

  <!-- Sharp Right-Side Todo Complete Badge / Checkmark -->
  <circle cx="44" cy="42" r="11" fill="#18110b" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M39 42 L42.5 45.5 L49 39" fill="none" stroke="url(#greenGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>